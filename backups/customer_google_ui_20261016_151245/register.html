<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account - Code Seller</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><button id="menuBtn" class="icon-btn">☰</button><a class="logo" href="index.html">Code Seller</a><div class="search"><input id="searchInput" placeholder="Search Code Seller"><button id="searchBtn">Search</button></div><a class="header-link" href="login.html">Sign in</a><a class="cart-link" href="cart.html">Cart <span id="cartCount" class="badge">0</span></a></header><div id="overlay" class="overlay"></div><aside id="sidebar" class="sidebar"><div class="side-head"><strong>Menu</strong><button id="closeMenu">×</button></div><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="deals.html">Deals</a><a href="offers.html">Festival Offers</a><div class="side-title">Account</div><a href="account.html">Account</a><a class="active" href="register.html">Create account</a></aside><main><section class="section" style="max-width:520px;margin:60px auto"><div class="product-card"><span class="eyebrow">ACCOUNT</span><h1>Create account</h1><p>Create your customer account to continue to checkout.</p><form id="registerForm"><label>Full name</label><input id="registerName" required type="text" style="width:100%;padding:12px;margin:7px 0 16px;border:1px solid var(--border);border-radius:9px"><label>Phone number</label><input id="registerPhone" required type="tel" style="width:100%;padding:12px;margin:7px 0 16px;border:1px solid var(--border);border-radius:9px"><label>Email</label><input id="registerEmail" required type="email" style="width:100%;padding:12px;margin:7px 0 16px;border:1px solid var(--border);border-radius:9px"><label>Password</label><input id="registerPassword" required type="password" style="width:100%;padding:12px;margin:7px 0 16px;border:1px solid var(--border);border-radius:9px"><button class="primary-button" type="submit">Create account</button><div id="registerMessage" style="margin-top:15px;color:var(--muted)"></div></form><p style="margin-top:22px">Already have an account? <a href="login.html" style="color:var(--primary)">Sign in</a></p></div></section></main><script src="js/app.js"></script></body></html>
